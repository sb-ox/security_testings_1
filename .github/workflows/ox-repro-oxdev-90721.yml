name: OX Security Scan (repro OXDEV-90721, DEV)
on:
  pull_request:
    branches: [main]
    paths:
      - 'repro-OXDEV-90721-jetty-gradle/**'
      - '.github/workflows/ox-repro-oxdev-90721.yml'
jobs:
  ox-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OX Security Scan
        uses: oxsecurity/ox-security-scan@main
        with:
          ox_host_url: https://dev-api.ox.security
          ox_api_key: ${{ secrets.OX_API_KEY_DEV_90721 }}
          ox_timeout: 20
