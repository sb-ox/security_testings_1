// OX QA repro fixture for OXDEV-90721 (PROD leg). Throwaway, removed after the run.
// Same jetty lines as the customer, plus one dependency Maven cannot resolve (like the customer's
// internal libraries), so the whole-pom dependency tree fails the way it did for them.
apply plugin: 'java'

group = 'com.oxsecurity.repro'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compile 'org.eclipse.jetty:jetty-server:9.4.11.v20180605'
    compile 'org.eclipse.jetty:jetty-util-ajax:[99.0,100.0)'
    testCompile 'org.eclipse.jetty:jetty-security:9.4.44.v20210927'
}
