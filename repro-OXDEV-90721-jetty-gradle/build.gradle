// Repro fixture for OXDEV-90721 (PR scan vs manual scan resolve one build.gradle line to different versions).
// Customer shape: a compile-scope jetty-server at 9.4.11, and a test-scope Jetty 9.4.44 family.
apply plugin: 'java'

group = 'com.oxsecurity.repro'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compile 'org.eclipse.jetty:jetty-server:9.4.11.v20180605'
    testCompile 'org.eclipse.jetty:jetty-security:9.4.44.v20210927'
    // Stands in for the customer's private libraries: Maven cannot resolve it, so the whole-file resolution fails.
    compile 'commons-io:commons-io:[99.0,100.0)'
}
